name: ci

# Lint, type-check, import boundaries, tests with a disposable PostgreSQL +
# Redis, and a migration check. Mirrors `make check`.
#
# The database service images (postgres:16, redis:7) intentionally match the
# other schema workflows; the application itself targets PostgreSQL 17 / Redis 8
# in production (see docker-compose.yml).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --frozen
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --frozen
      - name: mypy
        run: uv run mypy apps config

  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --frozen
      - name: import-linter
        run: uv run lint-imports

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cricket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cricket
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --frozen
      - name: Model changes must have migrations
        run: uv run python manage.py makemigrations --check --dry-run

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cricket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cricket
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --frozen
      - name: Tests with coverage gate (core + Phase B + Phase C apps >= 90% line+branch)
        run: |
          uv run pytest --cov=apps/core --cov=apps/venues --cov=apps/teams \
            --cov=apps/players --cov=apps/competitions --cov=apps/providers \
            --cov=apps/administration --cov=apps/matches --cov=apps/innings \
            --cov=apps/deliveries --cov=apps/scorecards --cov=apps/statistics \
            --cov=apps/ingestion --cov=apps/synchronization --cov-branch \
            --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Scoring coverage gate (apps/scoring >= 95% line+branch)
        run: |
          uv run pytest -o addopts="" tests/scoring -m "not benchmark" \
            --cov=apps/scoring --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: Phase C write path + rebuild + Cricsheet mapper (>= 95% line+branch)
        run: |
          uv run pytest -o addopts="" tests/phase_c -m "not benchmark" \
            --cov-config=.coveragerc-phasec --cov --cov-report=term-missing
      - name: Identity engine gate (identity_scoring + merge = 100% line+branch)
        run: |
          uv run pytest tests/players/test_identity_scoring.py \
            tests/players/test_identity_scoring_properties.py \
            tests/players/test_merge.py \
            --cov-config=.coveragerc-identity --cov --cov-report=term-missing
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
