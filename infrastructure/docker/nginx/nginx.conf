# Cricket OS proxy ladder config (Phase I Task 7 §11.1).
#
# A real proxy in front of the ASGI app (uvicorn on 127.0.0.1:8000) modelling
# the CDN/proxy behaviours that break naive SSE/WS clients, and the
# configuration that keeps them working:
#
#   * SSE streams must NOT be buffered, gzipped or cached — the event framing
#     (blank-line delimited blocks) is destroyed by all three. The app already
#     sends `Cache-Control: no-cache, no-transform` and `X-Accel-Buffering: no`
#     (apps/realtime/sse.py); this config ALSO disables buffering/cache/gzip
#     at the proxy for the SSE location and honours `X-Accel-Buffering: no`
#     on the default location (nginx honours that response header even when
#     `proxy_buffering on`).
#   * WebSocket upgrades must pass the `Upgrade`/`Connection` headers through
#     unchanged and must not time out a long-lived connection.
#   * REST reads proxy normally (buffered, gzipped) — compression here is fine
#     and expected.
#
# Run against the local stack (manual evidence):
#   docker run --rm -p 8080:80 \
#     -v $PWD/ops/proxy/nginx.conf:/etc/nginx/nginx.conf:ro \
#     nginx:1.29-alpine
# then run scripts/consumer_ladder.py --target localhost:8080.

user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Compression for ordinary REST payloads. `text/event-stream` is
    # deliberately ABSENT: gzip on an SSE stream breaks the blank-line event
    # framing (a naive config that compresses everything is exactly the bug
    # the consumer-ladder detects).
    gzip  on;
    gzip_vary on;
    gzip_comp_level 3;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    upstream cricket_app {
        server 127.0.0.1:8000;
    }

    server {
        listen       80;
        server_name  localhost;

        client_max_body_size 4m;

        # ---- SSE: never buffer, compress or cache the stream -------------- #
        # `X-Accel-Buffering: no` (sent by the app) would disable buffering
        # even with `proxy_buffering on`, but we make it explicit here: a
        # buffered SSE stream is truncated/held until the buffer fills, which
        # the ladder reports as a buffering-delay failure.
        location /api/v1/sse/ {
            proxy_pass http://cricket_app;
            proxy_http_version 1.1;
            # SSE must not be upgraded; keep the connection open, no hop
            # connection reuse.
            proxy_set_header Connection '';
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 3600s;   # long-lived stream
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # ---- WebSocket: pass the upgrade headers through ------------------ #
        location /api/v1/ws/ {
            proxy_pass http://cricket_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- REST: normal proxying (buffered + gzipped) ------------------- #
        location / {
            proxy_pass http://cricket_app;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering on;          # fine for REST
            proxy_read_timeout 60s;
            # The app's `X-Accel-Buffering: no` (SSE responses) is honoured
            # by nginx per-response even with buffering on.
        }
    }
}
