[project]
name = "cricket-os"
version = "0.1.0"
description = "Cricket OS backend — Phase A (Foundation)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "Django==6.1.2",
  "djangorestframework==3.18.3",
  "channels==4.3.2",
  "celery==5.6.3",
  "django-environ==0.14.0",
  "psycopg[binary]==3.3.6",
  "django-redis==7.0.0",
  "uvicorn==0.54.0",
  "drf-spectacular>=0.30.0",
]

[dependency-groups]
dev = [
  "ruff==0.17.3",
  "django-stubs[compatible-mypy]==6.1.2",
  "djangorestframework-stubs==3.18.1",
  "pytest==9.2.0",
  "pytest-django==4.14.0",
  "pytest-cov==7.1.0",
  "factory-boy==3.3.3",
  "hypothesis==6.170.13",
  "import-linter==2.15",
  "pytest-benchmark==5.3.0",
  "mutmut==3.8.1",
  "schemathesis>=4.32.7",
  "jsonschema>=4.26.0",
]

[tool.uv]
package = false

# --------------------------------------------------------------------------- #
# pytest / coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "-m",
  "not benchmark",
]
markers = [
  "unit: fast, no I/O",
  "integration: touches the database, cache or task queue",
  "contract: provider-adapter / API-shape contract",
  "e2e: full match lifecycle",
  "property: Hypothesis-generated scoring inputs",
  "scenario: TESTING_STRATEGY §14 lifecycle scenarios",
  "benchmark: performance smoke benchmarks (excluded by default)",
]

[tool.coverage.run]
# Default gate: apps/core + the Phase B reference-data apps + the Phase C
# historical-data apps, combined >= 90% line + branch (`make test` / CI).
# apps/scoring has its own stricter gate (>= 95% line + branch) run by
# `make test-scoring`, the identity engine (identity_scoring.py +
# services/merge.py) a 100% line+branch gate run by `make test-identity`
# (see .coveragerc-identity), and the Phase C write path + rebuild + Cricsheet
# mapper a >= 95% line+branch gate run by `make test-phasec`
# (see .coveragerc-phasec).
source = [
  "apps/core",
  "apps/venues",
  "apps/teams",
  "apps/players",
  "apps/competitions",
  "apps/providers",
  "apps/administration",
  "apps/matches",
  "apps/innings",
  "apps/deliveries",
  "apps/scorecards",
  "apps/statistics",
  "apps/ingestion",
  "apps/synchronization",
  "apps/live",
  "apps/realtime",
]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["apps", "config", "tests"]
extend-exclude = ["docs", ".venv", "**/migrations/*", "mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "DJ", "RUF", "PTH", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002"]
"config/settings/*" = ["F403", "F405"]
"apps/core/migrations/*" = ["E501", "F401"]
# Django model files: DJ001 (null=True on text/char fields) is mandated by the
# reference DDL (nullable text columns — the schema-drift check enforces NULL vs
# NOT NULL), and RUF012 fires on the standard `class Meta` constraints/indexes
# lists. Both are required Django idioms here, not lapses.
"apps/**/models.py" = ["DJ001", "RUF012"]
# CI helper script (pre-existing) prints DDL to stdout by design.
"scripts/**" = ["T201"]
# The standalone reference client is a CLI tool that prints by design.
"tools/**" = ["T201"]
# The load smoke gate is a CLI report tool that prints by design.
"loadtests/**" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# --------------------------------------------------------------------------- #
# mypy (django-stubs + djangorestframework-stubs)
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_reexport = true
files = ["apps", "config"]
exclude = ["(?x)(migrations/|config/settings/test\\.py)"]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["celery.*", "channels.*", "django_redis.*", "environ.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# --------------------------------------------------------------------------- #
# import-linter
# --------------------------------------------------------------------------- #
[tool.importlinter]
root_packages = ["apps"]
include_external_packages = false

# Real contract for what exists today: `core` is a leaf package and must not
# depend on any other first-party app.
[[tool.importlinter.contracts]]
name = "core is a leaf (imports no other first-party app)"
type = "independence"
modules = ["apps.core"]

# Six-layer discipline (Phase B+): selectors are read-optimised and must never
# reach into services; the API layer never touches provider adapters; the
# domain apps never import administration/ingestion/realtime; and the two
# mutually-referencing model modules (teams <-> players) never import each
# other's models directly (lazy string FKs only). Phase C extends the domain
# list to the new apps and forbids the reverse imports (ingestion and
# synchronization are allowed to import the domain, never the other way).
[[tool.importlinter.contracts]]
name = "selectors must not import services"
type = "forbidden"
source_modules = ["apps.*.selectors"]
forbidden_modules = ["apps.*.services"]

[[tool.importlinter.contracts]]
name = "api must not import provider adapters or ingestion/realtime"
type = "forbidden"
source_modules = ["apps.*.api"]
forbidden_modules = ["apps.providers.adapters", "apps.ingestion", "apps.realtime"]

[[tool.importlinter.contracts]]
name = "domain apps never import administration/ingestion/realtime"
type = "forbidden"
source_modules = [
  "apps.venues",
  "apps.teams",
  "apps.players",
  "apps.competitions",
  "apps.providers",
  "apps.matches",
  "apps.innings",
  "apps.deliveries",
  "apps.scorecards",
  "apps.statistics",
  "apps.rankings",
  "apps.search",
  "apps.synchronization",
]
forbidden_modules = ["apps.administration", "apps.ingestion", "apps.realtime"]

# Phase C: the delivery write path must never write derived scorecard rows
# directly — that is the scorecards module's job (ARCHITECTURE §3).
[[tool.importlinter.contracts]]
name = "deliveries must not write scorecard rows"
type = "forbidden"
source_modules = ["apps.deliveries"]
forbidden_modules = ["apps.scorecards.models"]

# Phase C: the scoring engine stays pure — nothing in it may import Django or
# any other first-party module except apps.core.
[[tool.importlinter.contracts]]
name = "scoring may import only core"
type = "forbidden"
source_modules = ["apps.scoring"]
forbidden_modules = [
  "apps.teams",
  "apps.players",
  "apps.matches",
  "apps.competitions",
  "apps.deliveries",
  "apps.scorecards",
  "apps.statistics",
  "apps.fantasy",
  "apps.providers",
  "apps.ingestion",
  "apps.realtime",
  "apps.administration",
  "apps.search",
]

# Phase E (ledger conflict 1): realtime depends only on core. The durable log
# and licensing policy are injected through apps.realtime.wiring by the
# composition root, so no realtime module may import any other first-party app.
[[tool.importlinter.contracts]]
name = "realtime depends only on core"
type = "forbidden"
source_modules = ["apps.realtime"]
forbidden_modules = [
  "apps.venues",
  "apps.teams",
  "apps.players",
  "apps.competitions",
  "apps.providers",
  "apps.matches",
  "apps.innings",
  "apps.deliveries",
  "apps.scorecards",
  "apps.statistics",
  "apps.ingestion",
  "apps.synchronization",
  "apps.live",
  "apps.administration",
  "apps.search",
  "apps.scoring",
]

[[tool.importlinter.contracts]]
name = "teams model module never imports players models"
type = "forbidden"
source_modules = ["apps.teams.models"]
forbidden_modules = ["apps.players.models"]

[[tool.importlinter.contracts]]
name = "players model module never imports teams models"
type = "forbidden"
source_modules = ["apps.players.models"]
forbidden_modules = ["apps.teams.models"]

# Real contract for the pure scoring engine: no other first-party domain module
# may be imported. `apps.core` remains the only permitted first-party dependency.
# --------------------------------------------------------------------------- #
# mutation testing (mutmut) — report-only; survivors are triaged in docs
# --------------------------------------------------------------------------- #
[tool.mutmut]
# Mutated source: the pure scoring engine plus its laws package. The scaffolding
# (`apps/__init__.py`, `apps/core`) is copied verbatim so the `mutants/` tree is a
# complete, importable `apps` package that shadows the real repo during mutmut's
# in-process pytest run (it inserts `mutants/` at the front of sys.path).
source_paths = ["apps/scoring"]
also_copy = ["apps/__init__.py", "apps/core"]
pytest_add_cli_args_test_selection = ["tests/scoring"]
# Keep pytest-django loaded (so its ini keys stay known under ``--strict-config``)
# but neutralise it: blank DJANGO_SETTINGS_MODULE (no settings import) and disable
# django_find_project (which would insert the real repo root at sys.path[0] and let
# the real ``apps`` shadow the mutated copy). The scoring tests are pure Python.
pytest_add_cli_args = [
  "-o",
  "DJANGO_SETTINGS_MODULE=",
  "-o",
  "django_find_project=false",
  "--hypothesis-profile=mutmut",
]

