# Recorded ICC-style men's rankings snapshots (internal test corpus).
# These are **recorded** rows (like the cricsheet match fixture): they are the
# replay corpus for the fixture-backed rankings adapter, never a live feed and
# never a guessed vendor API. Provider player ids resolve through
# ``provider_entity_map`` (entity_type="player"); a row with no mapping is
# reported to the DLQ (``rankings_import`` stage) and skipped.
#
# Two dated snapshots (2026-11-01, 2026-11-08) exercise trend derivation
# (Rohit drops 1->2, Kane rises 2->1) and best-rank/best-rating history.
